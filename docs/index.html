<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DiamondScore — KBO 앱 Codelabs</title>
  <meta name="description" content="SofaScore API로 KBO 실시간 Android 앱을 처음부터 만드는 단계별 따라하기 튜토리얼">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="assets/codelab.css">
</head>
<body>
  <div id="app">불러오는 중…</div>
  <script>
    window.$docsify = {
      name: 'DiamondScore Codelabs',
      repo: 'NamJa/Diamondscore',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      maxLevel: 3,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      search: {
        placeholder: '검색…',
        noData: '결과 없음',
        depth: 3,
      },
      // 단계 완료 체크 + 진행률 (localStorage). 레퍼런스 codelabs의 진행 UX를 가볍게 재현.
      plugins: [
        function progress(hook, vm) {
          var KEY = 'diamondscore_done';
          function load() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
          function save(o) { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} }
          hook.doneEach(function () {
            var path = (vm.route && vm.route.path) || location.hash;
            var main = document.querySelector('.markdown-section');
            if (!main) return;
            // 홈: 전체 진행률 요약
            var summary = document.getElementById('lab-progress');
            if (summary) {
              var done = load();
              var total = 10, cleared = 0;
              for (var i = 0; i <= 9; i++) if (done['/labs/step-' + i]) cleared++;
              var pct = Math.round((cleared / total) * 100);
              summary.innerHTML =
                '<div class="pbar"><span style="width:' + pct + '%"></span></div>' +
                '<p class="pnote">' + cleared + ' / ' + total + ' 단계 완료 · ' + pct + '%</p>';
            }
            // 랩 페이지: 하단에 완료 토글
            if (path.indexOf('/labs/step-') === 0) {
              var done = load();
              var wrap = document.createElement('div');
              wrap.className = 'lab-done';
              var on = !!done[path];
              wrap.innerHTML = '<button class="done-btn' + (on ? ' on' : '') + '">' +
                (on ? '✓ 이 단계 완료함 (되돌리기)' : '이 단계 완료로 표시') + '</button>';
              main.appendChild(wrap);
              wrap.querySelector('button').addEventListener('click', function () {
                var d = load();
                if (d[path]) delete d[path]; else d[path] = Date.now();
                save(d);
                vm.route && location.reload();
              });
            }
          });
        }
      ],
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-kotlin.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-groovy.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-toml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
